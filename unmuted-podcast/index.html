<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNMUTED Podcast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top Navigation -->
  <header>
    <h1>UNMUTED</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#categories">Categories</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main id="podcast-container">
    <!-- Podcast shows will render here via JS -->
  </main>

  <!-- Podcast Modal -->
  <div id="podcastModal" class="modal">
    <div class="modal-content">
      <span class="modal-close">&times;</span>
      <h2 class="modal-title"></h2>
      <img class="modal-image" src="" alt="">
      <p class="modal-genres"></p>
      <p class="modal-last-updated"></p>
      <div class="modal-seasons"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
